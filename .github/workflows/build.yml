name: Build addon

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The runner keeps third_party/ between runs; one build at a time. The group is
# shared with sdk-capabilities.yml; queue: max keeps every waiting run in line
# instead of cancelling it when another run joins the group.
concurrency:
  group: godot-firebase-build
  cancel-in-progress: false
  queue: max

jobs:
  build:
    # Fork pull requests never run on the persistent self-hosted runner: it keeps
    # third_party/ and SCons state between runs and has a writable $HOME.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      GODOT: godot
      NDK_VERSION: 28.1.13356709
      # Extracted SDK sources stay on the runner between runs (about 1.5 GB);
      # archives, build products and the workspace are removed after every run.
      THIRD_PARTY_CACHE: ${{ github.workspace }}/../godot-firebase-third-party
      # Downloads (~2.1 GB) plus iOS and Android builds need this much free space.
      MIN_FREE_GB: 10
      # godot-firebase.zip always holds every module.
      MODULE_SELECTION: auth,firestore,storage,database,functions,analytics,remote_config,crashlytics

    steps:
      - name: Check self-hosted toolchain
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          DEVELOPER_DIR="$(xcode-select -p)"
          if ! test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"; then
            DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
          fi
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild" || {
            echo '::error::Full Xcode is required on this runner.'
            exit 1
          }
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          command -v uvx >/dev/null || {
            echo '::error::uv is required on this runner (SCons runs through uvx).'
            exit 1
          }

      - name: Check free disk space
        run: |
          set -euo pipefail
          df -h "$GITHUB_WORKSPACE"
          free_gb=$(df -g "$GITHUB_WORKSPACE" | awk 'NR == 2 {print $4}')
          if [ "$free_gb" -lt "$MIN_FREE_GB" ]; then
            echo "::error::Runner has ${free_gb} GB free; this build needs ${MIN_FREE_GB} GB."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: true
          persist-credentials: false

      - name: Select SDKMAN Java 17
        run: zsh tools/setup_sdkman_java_ci.zsh

      - name: Test iOS signing checks
        run: python3 tests/test_ios_signing.py

      - name: Install Android SDK and pinned NDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;28.1.13356709'

      - name: Check Android toolchain
        run: |
          set -euo pipefail
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/darwin-x86_64/bin/llvm-readelf"
          "$JAVA_HOME/bin/javac" -version

      - name: Install locked CocoaPods
        run: bash tools/setup_cocoapods_ci.sh

      - name: Check Godot version
        run: |
          set -euo pipefail
          source tools/versions.env
          actual="$(godot --version)"
          case "$actual" in
            "$GODOT_VERSION.stable"|"$GODOT_VERSION.stable".*) ;;
            *)
              echo "::error::Godot $GODOT_VERSION is required; runner has $actual"
              exit 1
              ;;
          esac

      - name: Download pinned dependencies
        run: |
          set -euo pipefail
          mkdir -p "$THIRD_PARTY_CACHE"
          ln -sfn "$THIRD_PARTY_CACHE" third_party
          tools/bootstrap.sh

      - name: Test GDScript API with mocks
        run: tools/run_tests.sh

      - name: Test Android Maven pins against the C++ SDK's Firebase BoM
        run: python3 tests/test_android_dependency_pins.py

      - name: Test Android bridge AAR
        run: bash tests/test_android_aar.sh

      # Build every mobile target with one module selection. Windows and Linux
      # editor stubs are tracked through LFS and included by the packager.
      # Releases are signed and published locally with tools/release.sh, never here.
      - name: Build and verify release selection
        run: |
          set -euo pipefail
          tools/build.sh --platforms ios,android,macos --modules "$MODULE_SELECTION"
          test "$(cat addons/firebase/bin/modules.txt)" = "$MODULE_SELECTION"
          tools/run_tests.sh
          package_path="$(tools/package.sh)"
          test "$(basename "$package_path")" = godot-firebase.zip
          python3 tests/test_sdk_capability_packages.py --smoke-package build/dist/godot-firebase.zip

      # Runs after success, failure and cancellation so the shared runner disk never fills.
      - name: Clean workspace and dependency leftovers
        if: always()
        run: |
          set -uo pipefail
          # Everything untracked in the checkout: build/, addons/firebase/bin/,
          # .godot/, compiled objects and the third_party link.
          git -C "$GITHUB_WORKSPACE" clean -ffdxq
          if [ -d "$THIRD_PARTY_CACHE" ]; then
            rm -f "$THIRD_PARTY_CACHE"/*.zip "$THIRD_PARTY_CACHE"/*.part
            for dir in "$THIRD_PARTY_CACHE/firebase_cpp_sdk" "$THIRD_PARTY_CACHE/Firebase"; do
              [ -f "$dir/.complete" ] || rm -rf "$dir"
            done
            # godot-cpp keeps its sources; generated bindings and libraries go.
            [ -d "$THIRD_PARTY_CACHE/godot-cpp/.git" ] && git -C "$THIRD_PARTY_CACHE/godot-cpp" clean -ffdxq
            du -sh "$THIRD_PARTY_CACHE"
          fi
          rm -rf "$HOME/Library/Application Support/Godot/app_userdata/Godot Firebase"
          df -h "$GITHUB_WORKSPACE"
