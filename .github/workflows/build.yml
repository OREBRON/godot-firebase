name: Build addon

on:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      variants:
        description: 'Space-separated module lists, for example "auth auth,storage". Empty builds the default variants.'
        required: false

permissions:
  contents: read

# The runner keeps third_party/ between runs; one build at a time.
concurrency:
  group: godot-firebase-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    permissions:
      # Tag builds attach their addon zips to the GitHub release.
      contents: write
    defaults:
      run:
        shell: bash
    env:
      GODOT: godot
      # Extracted SDK sources stay on the runner between runs (about 1.5 GB);
      # archives, build products and the workspace are removed after every run.
      THIRD_PARTY_CACHE: ${{ github.workspace }}/../godot-firebase-third-party
      # Downloads (~2.1 GB) plus iOS builds need this much free space.
      MIN_FREE_GB: 10
      # One addon package per module list: every module first, then each module alone.
      VARIANTS: ${{ github.event.inputs.variants || 'auth,firestore,storage,database,functions auth firestore storage database functions' }}

    steps:
      - name: Check self-hosted toolchain
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          DEVELOPER_DIR="$(xcode-select -p)"
          if ! test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"; then
            DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
          fi
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild" || {
            echo '::error::Full Xcode is required on this runner.'
            exit 1
          }
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          command -v uvx >/dev/null || {
            echo '::error::uv is required on this runner (SCons runs through uvx).'
            exit 1
          }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            command -v gh >/dev/null || {
              echo '::error::GitHub CLI is required on this runner to publish releases.'
              exit 1
            }
          fi

      - name: Check free disk space
        run: |
          set -euo pipefail
          df -h "$GITHUB_WORKSPACE"
          free_gb=$(df -g "$GITHUB_WORKSPACE" | awk 'NR == 2 {print $4}')
          if [ "$free_gb" -lt "$MIN_FREE_GB" ]; then
            echo "::error::Runner has ${free_gb} GB free; this build needs ${MIN_FREE_GB} GB."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check Godot version
        run: |
          set -euo pipefail
          source tools/versions.env
          actual="$(godot --version)"
          case "$actual" in
            "$GODOT_VERSION.stable"|"$GODOT_VERSION.stable".*) ;;
            *)
              echo "::error::Godot $GODOT_VERSION is required; runner has $actual"
              exit 1
              ;;
          esac

      - name: Download pinned dependencies
        run: |
          set -euo pipefail
          mkdir -p "$THIRD_PARTY_CACHE"
          ln -sfn "$THIRD_PARTY_CACHE" third_party
          tools/bootstrap.sh

      - name: Test GDScript API with mocks
        run: tools/run_tests.sh

      # Each variant builds the macOS editor stub and iOS, runs the tests again
      # with the stub library loaded and packages an addon zip.
      - name: Build variants
        run: |
          set -euo pipefail
          read -ra variants <<< "$VARIANTS"
          for modules in "${variants[@]}"; do
            echo "::group::Build $modules"
            tools/build.sh --modules "$modules"
            tools/run_tests.sh
            tools/package.sh
            echo "::endgroup::"
          done

      # The zips from tools/package.sh become release assets as they are.
      # A release created by hand for the tag gets the zips added to it.
      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd build/dist && shasum -a 256 -- *.zip > SHA256SUMS.txt)
          assets=(build/dist/*.zip build/dist/SHA256SUMS.txt)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi

      # Runs after success, failure and cancellation so the shared runner disk never fills.
      - name: Clean workspace and dependency leftovers
        if: always()
        run: |
          set -uo pipefail
          # Everything untracked in the checkout: build/, addons/firebase/bin/,
          # .godot/, compiled objects and the third_party link.
          git -C "$GITHUB_WORKSPACE" clean -ffdxq
          if [ -d "$THIRD_PARTY_CACHE" ]; then
            rm -f "$THIRD_PARTY_CACHE"/*.zip
            for dir in "$THIRD_PARTY_CACHE/firebase_cpp_sdk" "$THIRD_PARTY_CACHE/Firebase"; do
              [ -f "$dir/.complete" ] || rm -rf "$dir"
            done
            # godot-cpp keeps its sources; generated bindings and libraries go.
            [ -d "$THIRD_PARTY_CACHE/godot-cpp/.git" ] && git -C "$THIRD_PARTY_CACHE/godot-cpp" clean -ffdxq
            du -sh "$THIRD_PARTY_CACHE"
          fi
          rm -rf "$HOME/Library/Application Support/Godot/app_userdata/Godot Firebase"
          df -h "$GITHUB_WORKSPACE"
